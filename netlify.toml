[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for any path (existing files are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Netlify UI:
# Site settings → Environment variables. (Do not commit real keys.)

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
